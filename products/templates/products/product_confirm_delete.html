{% extends "base.html" %}

{% block title %}Delete {{ product.name }} | moncherie corner{% endblock %}

{% block content %}
<section class="container form-page">
  <h1 class="page-title">Delete product</h1>
  <div class="form-card">
    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-shop">Yes, delete it</button>
      <a href="{% url 'products:manage' %}" class="ms-2">No, go back</a>
    </form>
  </div>
</section>
{% endblock %}
