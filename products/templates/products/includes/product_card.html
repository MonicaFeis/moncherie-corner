{% load static %}
<article class="product-card h-100">
  <a href="{{ product.get_absolute_url }}" class="product-card-image">
    {% if product.is_sold_out %}
      <img src="{% static 'images/sold-out.jpg' %}" alt="{{ product.name }}: sold out" loading="lazy">
    {% elif product.image %}
      <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">
    {% else %}
      <span class="image-placeholder">Image coming soon</span>
    {% endif %}
  </a>
  <div class="p-3">
    <p class="product-category mb-1">{{ product.category.name }}</p>
    <h3 class="product-name"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    <p class="product-price mb-0">€{{ product.price }}</p>
  </div>
</article>
