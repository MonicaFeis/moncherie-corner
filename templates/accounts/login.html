{% extends "base.html" %}

{% block title %}Log in | moncherie corner{% endblock %}

{% block content %}
<section class="container form-page">
  <h1 class="page-title">Log in</h1>
  <form method="post" class="form-card" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-shop mt-3">Log in</button>
  </form>
  <p class="mt-3">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</section>
{% endblock %}
