<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hong Kong octagon-and-dot floor tile, drawn for moncherie corner -->
  <rect width="40" height="40" fill="#F3EAD8"/>
  <g fill="#17614A">
    <polygon points="0,0 11,0 0,11"/>
    <polygon points="29,0 40,0 40,11"/>
    <polygon points="40,29 40,40 29,40"/>
    <polygon points="0,29 0,40 11,40"/>
  </g>
  <polygon points="11,0 29,0 40,11 40,29 29,40 11,40 0,29 0,11" fill="none" stroke="#C9B89C" stroke-width="1"/>
</svg>
