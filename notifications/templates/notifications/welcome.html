<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    /* Phones and mail apps in dark mode: dark page, cream text */
    @media (prefers-color-scheme: dark) {
      .em-body { background: #1B1A26 !important; color: #F3E7CB !important; }
      .em-red { color: #FF9B8F !important; }
      .em-line { border-color: #E0A84A !important; }
      .em-box { background: #26253A !important; }
    }
  </style>
</head>
<body class="em-body" style="margin:0;background:#F2E0C1;font-family:Arial,'PingFang HK','Microsoft JhengHei',sans-serif;color:#2A2320;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;">
    <tr><td align="center" style="background:#14504F;color:#F3E7CB;padding:20px 16px;">
      <img src="{{ logo_url }}" alt="moncherie corner logo" width="64" height="64" style="display:block;margin:0 auto 6px;border:0;">
      <div style="font-size:22px;font-weight:bold;line-height:1.3;">moncherie corner</div>
      <div style="font-size:15px;letter-spacing:4px;line-height:1.4;">車厘小角</div>
    </td></tr>
    <tr><td style="padding:24px 18px;font-size:16px;line-height:1.6;">
      <p>Hi {{ user.username }},</p>
      <p>Welcome to moncherie corner! Your account is ready.</p>
      <p>With your account you can buy hand-drawn stickers, prints and portraits, download your digital files, and see all your orders in one place.</p>
      <p><a href="{{ site_url }}" style="display:inline-block;background:#B02F22;color:#F3E7CB;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:bold;">Come on in</a></p>
      <p>See you at the corner!</p>
    </td></tr>
  </table>
</body>
</html>
