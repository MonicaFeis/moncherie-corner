<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <style>:root { color-scheme: light only; supported-color-schemes: light only; }</style>
</head>
<body style="margin:0;background:#F2E0C1;font-family:Arial,'PingFang HK','Microsoft JhengHei',sans-serif;color:#2A2320;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td style="background:#14504F;color:#F3E7CB;padding:16px 28px;font-size:22px;font-weight:bold;">
      <img src="{{ logo_url }}" alt="moncherie corner logo" width="56" height="56" style="display:inline-block;vertical-align:middle;margin-right:12px;border:0;">
      <span style="vertical-align:middle;">moncherie corner 轉角小店</span>
    </td></tr>
    <tr><td style="padding:28px;font-size:16px;line-height:1.6;">
      <p>Hi {{ user.username }},</p>
      <p>Welcome to moncherie corner! Your account is ready.</p>
      <p>With your account you can buy hand-drawn stickers, prints and portraits, download your digital files any time, and see all your orders in one place.</p>
      <p><a href="{{ site_url }}" style="display:inline-block;background:#B02F22;color:#F3E7CB;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:bold;">Come on in</a></p>
      <p>See you at the corner!</p>
    </td></tr>
  </table>
</body>
</html>
