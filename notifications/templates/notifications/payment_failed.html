<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <style>:root { color-scheme: light only; supported-color-schemes: light only; }</style>
</head>
<body style="margin:0;background:#FFFFFF;font-family:Arial,'PingFang HK','Microsoft JhengHei',sans-serif;color:#2A2320;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;">
    <tr><td align="center" style="background:#14504F;color:#F3E7CB;padding:20px 16px;">
      <img src="{{ logo_url }}" alt="moncherie corner logo" width="64" height="64" style="display:block;margin:0 auto 6px;border:0;">
      <div style="font-size:22px;font-weight:bold;line-height:1.3;">moncherie corner</div>
      <div style="font-size:15px;letter-spacing:4px;line-height:1.4;">車厘小角</div>
    </td></tr>
    <tr><td style="padding:24px 18px;font-size:16px;line-height:1.7;">
      <p>{{ order.user.username }}，你好！<br>Hi {{ order.user.username }},</p>
      <p>你嘅訂單 #{{ order.pk }} 未完成付款，我哋冇收取任何費用。<br>
         The payment for order #{{ order.pk }} didn't go through, so nothing was charged.</p>
      <p>你嘅購物袋已經保留。<br>Your bag is saved, so you can try again any time.</p>
      <p><a href="{{ site_url }}{% url 'cart:detail' %}" style="display:inline-block;background:#B02F22;color:#F3E7CB;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:bold;">再試 Try again</a></p>
    </td></tr>
  </table>
</body>
</html>
