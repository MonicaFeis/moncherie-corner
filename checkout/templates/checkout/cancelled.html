{% extends "base.html" %}
{% load static %}

{% block title %}Payment not completed | moncherie corner{% endblock %}

{% block content %}
<section class="container text-center status-page">
  <img src="{% static 'images/sign-payment-failed.png' %}" class="img-fluid status-image"
       alt="Shop sign: 哎呀, Oops, 再試一次啦, with a surprised girl and a crossed-out bank card">
  <h1 class="page-title">付款未完成 Payment didn't go through</h1>
  <p>Nothing was charged and your bag is saved. You can try again whenever you like.</p>
  <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
    <a href="{% url 'checkout:checkout' %}" class="btn btn-shop">再試 Try again</a>
    <a href="{% url 'cart:detail' %}" class="btn btn-shop-outline">返回購物袋 Back to bag</a>
  </div>
</section>
{% endblock %}
